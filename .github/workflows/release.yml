name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Autoclick.xcodeproj \
            -scheme Autoclick

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12:-}" ]]; then
            echo "No signing certificate configured; release artifact will be unsigned."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-password}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          printf "%s" "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Build universal app
        run: |
          xcodebuild archive \
            -project Autoclick.xcodeproj \
            -scheme Autoclick \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Autoclick.xcarchive" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Sign app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"

          if [[ -z "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            echo "No Developer ID identity configured; skipping codesign."
            exit 0
          fi

          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"

          codesign --verify --strict --deep --verbose=2 "$APP_PATH"

      - name: Package app
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi

          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          ZIP_PATH="$DIST_DIR/Autoclick-${VERSION}.zip"

          mkdir -p "$DIST_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          shasum -a 256 "$ZIP_PATH" | tee "$ZIP_PATH.sha256"
          lipo -info "$APP_PATH/Contents/MacOS/Autoclick"

      - name: Notarize app
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" || -z "${APP_STORE_CONNECT_API_KEY_P8:-}" ]]; then
            echo "Notarization credentials are not configured; skipping notarization."
            exit 0
          fi

          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf "%s" "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | tee "$ZIP_PATH.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Autoclick-${{ env.VERSION }}
          path: |
            dist/Autoclick-${{ env.VERSION }}.zip
            dist/Autoclick-${{ env.VERSION }}.zip.sha256

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes "Autoclick $VERSION"
          fi

      - name: Update Homebrew tap
        if: github.ref_type == 'tag'
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_CASK_TOKEN: ${{ vars.HOMEBREW_CASK_TOKEN }}
        run: |
          set -euo pipefail

          TAP_REPOSITORY="${HOMEBREW_TAP_REPOSITORY:-}"
          TAP_TOKEN="${HOMEBREW_TAP_TOKEN:-}"
          CASK_TOKEN="${HOMEBREW_CASK_TOKEN:-autoclick}"
          CASK_PATH="Casks/${CASK_TOKEN}.rb"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Autoclick-${VERSION}.zip"
          SHA256="$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')"

          if [[ -z "$TAP_REPOSITORY" || -z "$TAP_TOKEN" ]]; then
            echo "Homebrew tap is not configured; skipping tap update."
            exit 0
          fi

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$RUNNER_TEMP/homebrew-tap"
          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks

          cat > "$CASK_PATH" <<EOF
          cask "$CASK_TOKEN" do
            version "$VERSION"
            sha256 "$SHA256"

            url "$RELEASE_URL"
            name "Autoclick"
            desc "Configurable macOS autoclicker"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            app "Autoclick.app"
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"

          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi

          git commit -m "Update ${CASK_TOKEN} to ${VERSION}"
          git push
