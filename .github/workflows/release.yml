name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer to publish. Defaults to .release-please-manifest.json when publishing."
        required: false
      publish_release:
        description: "Create a GitHub release and update the Homebrew tap"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare release metadata
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
        run: |
          set -euo pipefail

          PUBLISH_RELEASE="false"
          TAG_NAME=""

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG_NAME="$GITHUB_REF_NAME"
            PUBLISH_RELEASE="true"
          elif [[ "$INPUT_PUBLISH_RELEASE" == "true" ]]; then
            if [[ "$GITHUB_REF_NAME" != "master" ]]; then
              echo "::error::Manual release publishing must run from master."
              exit 1
            fi

            VERSION="$INPUT_VERSION"

            if [[ -z "$VERSION" ]]; then
              VERSION="$(ruby -rjson -e 'print JSON.parse(File.read(".release-please-manifest.json")).fetch(".")')"
            fi

            TAG_NAME="v$VERSION"
            PUBLISH_RELEASE="true"
          else
            VERSION="$INPUT_VERSION"

            if [[ -z "$VERSION" ]]; then
              VERSION="manual-${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [[ "$PUBLISH_RELEASE" == "true" && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a SemVer value."
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "PUBLISH_RELEASE=$PUBLISH_RELEASE" >> "$GITHUB_ENV"

      - name: Validate publish prerequisites
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$PUBLISH_RELEASE" != "true" ]]; then
            echo "Artifact-only run; skipping publish prerequisite checks."
            exit 0
          fi

          missing=()

          [[ -n "${MACOS_CERTIFICATE_P12:-}" ]] || missing+=("MACOS_CERTIFICATE_P12")
          [[ -n "${MACOS_CERTIFICATE_PASSWORD:-}" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "${MACOS_KEYCHAIN_PASSWORD:-}" ]] || missing+=("MACOS_KEYCHAIN_PASSWORD")
          [[ -n "${DEVELOPER_ID_APPLICATION:-}" ]] || missing+=("DEVELOPER_ID_APPLICATION")
          [[ -n "${APP_STORE_CONNECT_API_KEY_ID:-}" ]] || missing+=("APP_STORE_CONNECT_API_KEY_ID")
          [[ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "${APP_STORE_CONNECT_API_KEY_P8:-}" ]] || missing+=("APP_STORE_CONNECT_API_KEY_P8")
          [[ -n "${HOMEBREW_TAP_REPOSITORY:-}" ]] || missing+=("HOMEBREW_TAP_REPOSITORY")

          if [[ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" && -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            missing+=("HOMEBREW_TAP_DEPLOY_KEY or HOMEBREW_TAP_TOKEN")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Published releases require these missing secrets or variables: ${missing[*]}"
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; this run can refresh the Homebrew tap only."
          else
            echo "Release $TAG_NAME does not exist yet; this run will create it."
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Autoclick.xcodeproj \
            -scheme Autoclick

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${MACOS_CERTIFICATE_P12:-}" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::MACOS_CERTIFICATE_P12 is required for published releases."
              exit 1
            fi

            echo "No signing certificate configured; artifact-only build will be unsigned."
            exit 0
          fi

          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-temporary-password}"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          printf "%s" "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

      - name: Build universal app
        run: |
          xcodebuild archive \
            -project Autoclick.xcodeproj \
            -scheme Autoclick \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Autoclick.xcarchive" \
            -destination "generic/platform=macOS" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Sign app
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"

          if [[ -z "${DEVELOPER_ID_APPLICATION:-}" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::DEVELOPER_ID_APPLICATION is required for published releases."
              exit 1
            fi

            echo "No Developer ID identity configured; skipping codesign."
            exit 0
          fi

          codesign \
            --force \
            --deep \
            --options runtime \
            --timestamp \
            --sign "$DEVELOPER_ID_APPLICATION" \
            "$APP_PATH"

          codesign --verify --strict --deep --verbose=2 "$APP_PATH"

      - name: Package app
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          ZIP_PATH="$DIST_DIR/Autoclick-${VERSION}.zip"

          mkdir -p "$DIST_DIR"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

          shasum -a 256 "$ZIP_PATH" | tee "$ZIP_PATH.sha256"
          lipo -info "$APP_PATH/Contents/MacOS/Autoclick"

      - name: Notarize app
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          if [[ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" || -z "${APP_STORE_CONNECT_ISSUER_ID:-}" || -z "${APP_STORE_CONNECT_API_KEY_P8:-}" ]]; then
            if [[ "$PUBLISH_RELEASE" == "true" ]]; then
              echo "::error::App Store Connect notarization credentials are required for published releases."
              exit 1
            fi

            echo "Notarization credentials are not configured; skipping notarization."
            exit 0
          fi

          APP_PATH="$RUNNER_TEMP/Autoclick.xcarchive/Products/Applications/Autoclick.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf "%s" "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APP_STORE_CONNECT_API_KEY_ID" \
            --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" | tee "$ZIP_PATH.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Autoclick-${{ env.VERSION }}
          path: |
            dist/Autoclick-${{ env.VERSION }}.zip
            dist/Autoclick-${{ env.VERSION }}.zip.sha256

      - name: Create GitHub release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; skipping immutable release creation."
            exit 0
          fi

          RELEASE_FLAGS=()

          if [[ "$VERSION" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          gh release create "$TAG_NAME" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${RELEASE_FLAGS[@]}"

      - name: Update Homebrew tap
        if: env.PUBLISH_RELEASE == 'true'
        env:
          HOMEBREW_TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_CASK_TOKEN: ${{ vars.HOMEBREW_CASK_TOKEN }}
        run: |
          set -euo pipefail

          TAP_REPOSITORY="${HOMEBREW_TAP_REPOSITORY:-}"
          TAP_DEPLOY_KEY="${HOMEBREW_TAP_DEPLOY_KEY:-}"
          TAP_TOKEN="${HOMEBREW_TAP_TOKEN:-}"
          CASK_TOKEN="${HOMEBREW_CASK_TOKEN:-autoclick}"
          CASK_PATH="Casks/${CASK_TOKEN}.rb"
          CASK_RENDERER="$GITHUB_WORKSPACE/scripts/render-homebrew-cask.sh"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/Autoclick-${VERSION}.zip"
          SHA256="$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')"

          if [[ -z "$TAP_REPOSITORY" ]]; then
            echo "Homebrew tap is not configured; skipping tap update."
            exit 0
          fi

          if [[ -n "$TAP_DEPLOY_KEY" ]]; then
            KEY_PATH="$RUNNER_TEMP/homebrew-tap-deploy-key"
            mkdir -p "$HOME/.ssh"
            printf "%s\n" "$TAP_DEPLOY_KEY" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            ssh-keyscan github.com >> "$HOME/.ssh/known_hosts"
            export GIT_SSH_COMMAND="ssh -i $KEY_PATH -o IdentitiesOnly=yes"
            git clone "git@github.com:${TAP_REPOSITORY}.git" "$RUNNER_TEMP/homebrew-tap"
          elif [[ -n "$TAP_TOKEN" ]]; then
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" "$RUNNER_TEMP/homebrew-tap"
          else
            echo "Homebrew tap credential is not configured; skipping tap update."
            exit 0
          fi

          cd "$RUNNER_TEMP/homebrew-tap"
          mkdir -p Casks

          CASK_TOKEN="$CASK_TOKEN" \
            VERSION="$VERSION" \
            SHA256="$SHA256" \
            RELEASE_URL="$RELEASE_URL" \
            HOMEPAGE="https://github.com/${GITHUB_REPOSITORY}" \
            "$CASK_RENDERER" > "$CASK_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_PATH"

          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date."
            exit 0
          fi

          git commit -m "Update ${CASK_TOKEN} to ${VERSION}"
          git push
